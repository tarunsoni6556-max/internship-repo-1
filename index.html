<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: rgb(237, 140, 71);
        }

        .a {
            background-color: rgb(194, 208, 215);
            display: block;
            margin: 20px;
            ;
            padding: 40px;
            width: 300px;
        }

        .content {
            background-color: rgb(224, 189, 139);
            width: 300px;
            padding: 20px;
            border-radius: 10px;
            position: relative;
        }

        .badge {
            background-color: rgb(209, 209, 153);
            padding: 10px;
            border: 3px;
            position: absolute;
            top: 0;
            left: 0;
        }

        .badge-new {
            background-color: rgb(224, 124, 124);
            padding: 20px;
            border: 4px;
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            filter: drop-shadow(2px 4px 6px rgb(100, 72, 72));
        }
    </style>
</head>

<body>
    <div class="a">HELLO</div>
    <div class="a">HTML</div>
    <div class="content">
        <p>
            lorem ipsum dolor sit amet consectetur adipisicing elit. Qui iure aliquid voluptatum pariatur, officia
            voluptatem iusto, iste corrupti sed modi quasi minima amet repudiandae numquam dicta autem. Assumenda,
            impedit. Incidunt.</p>


        <div class=" badge badge-new">tarun</div>
    </div>
</body>

</html>
