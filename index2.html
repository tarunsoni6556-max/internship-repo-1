<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .content {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            background-color: #f793e6;  
            border: 2px solid #56234e;
            padding: 20px;
            margin: 25px;
            height: 100px;
            align-items: center;
            color: white;

            
        }
        .badge {
            background-color: #4c0ba7;
            padding: 10px;
            margin: 2px 0;
            border-radius: 30px;
            text-align: left;

        }
        .badge:hover {
            background-color: #7e7676;
            cursor: pointer;
        }
        .badge_2 {
            background-color: #c023f0;
            color: #4e2424;
            text-align: flex-start;
        }
        .badge_2:hover {
            background-color: #efebed;
            color: #49113a;
        }
        .badge_3 {
            background-color: #6306c6;
            color: #022834;
            text-align: flex-start;
        }
        .badge_3:hover {
            background-color: #eef1f1;
            color: #0e334a;
        }
        .badge_4 {
            background-color: #5b0bda;
            color: #113c5c;
            text-align: flex-start;
        }
        .badge_4:hover {
            background-color: #e4e5ef;
            color: #103f5c;
        }
        .badge_5 {
            background-color: #1129c7;
            color: #114570;
            text-align: flex-start;
        }
        .badge_5:hover {
            background-color: #d5cfd9;
            color: #0f3c54;
        }
        .badge_6 {
            background-color: #6710a0;
            color: #4e2424;
            text-align: flex-start;
        }
        .badge_6:hover {
            background-color: #e1d8d8;
            color: #115478;
        }
        .content2 {
            display: grid;
            flex-direction: row;
            grid-template-columns: 1fr 1fr 1fr ;
            gap: 5px;
            margin: 50px;

        }

        .new_item {
            background-color: #c5b2c4;
            padding: 10px;
            margin: 2px 0;
            border-radius: 30px;
            text-align: left;
            width: 100px;
        }

        .new_item:hover {
            background-color: #e6b3e6;
            cursor: pointer;
            border: 1px solid #000000;
        }
    </style>
</head>
<body>
    <div class="content"><div class="badge">Monday</div>
    <div class="badge badge_2">Tuesday</div>
    <div class="badge badge_3">Wednesday</div>
    <div class="badge badge_4">Thursday</div>
    <div class="badge badge_5">Friday</div>
    <div class="badge badge_6">Saturday</div>
    </div>
    <div class="content2">
    <div class="new_item">day.1</div>
    <div class="new_item">day.2</div>
    <div class="new_item">day.3</div>
    <div class="new_item">day.4</div>
    <div class="new_item">day.5</div>
    <div class="new_item">day.6</div>
    <div class="new_item">day.7</div>
    <div class="new_item">day.8</div>
    <div class="new_item">day.9</div>
    
</body>
</html>
